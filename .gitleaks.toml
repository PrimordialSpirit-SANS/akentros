# gitleaks 設定:本 repo 不應出現任何真實金鑰。
# 供應商金鑰只允許以「環境變數名稱」(如 OPENROUTER_API_KEY_1)出現於設定與文件。
# 預設規則集之外,額外攔截 Akentros 金鑰形態的明文。

title = "Akentros Gateway secret scan"

[extend]
useDefault = true

[[rules]]
id = "akentros-key-plaintext"
description = "Akentros API key plaintext"
regex = '''sk-akentros-(live|test)_[A-Za-z0-9]{16,}'''
keywords = ["sk-akentros"]
tags = ["key", "akentros"]

[allowlist]
description = "文件中的佔位與遮罩形式"
regexes = [
  '''sk-akentros-live_…''',
  '''sk-akentros-live_…''',
  '''sk-akentros-(live|test)_(YOUR|xxx|\$\{)''',
]
