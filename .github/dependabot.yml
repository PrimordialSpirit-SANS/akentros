version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # ECO-SUPPLY-2: keep the Dockerfile base images (node:22-slim,
  # nginx:1.27-alpine) fresh alongside the npm tree.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
