# ECO-SUPPLY-2 — console reverse proxy (Topology D).
#
# SSE-safe upstream wiring: buffering off, long read timeouts, HTTP/1.1
# keep-alive. Identity headers follow the README's AKENTROS_TRUST_PROXY
# contract: cf-connecting-ip is OVERWRITTEN from the socket (never taken
# from the client), X-Forwarded-* appended — a proxy in front of this
# nginx must likewise overwrite, not append, cf-connecting-ip.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://akentros-gateway:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header cf-connecting-ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: forward chunks as produced; never buffer a generation stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Coarse outer guard only — the gateway enforces its own body limit
        # with a precise, contract-tested value.
        client_max_body_size 20m;
    }

    # SPA fallback for react-router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets — cache them immutably
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
